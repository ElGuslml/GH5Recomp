# gh5_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed, [[switch_tables]] the
# codegen mistranslates and [[midasm_hook]]s into src/. KameoRecomp's kameo_functions.toml, POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml have examples of each.
#
# Later, as in those games: the C runtime's setjmp_address / longjmp_address (with share_registers on their
# callers), then the *_as_local codegen options (the registers as local variables, a CPU gain), each checked as
# CLAUDE.md says.

[functions]
# Branch (b) targets that the automatic analysis did not assign to any function (the first build, 2026-10-30). All
# are small functions reached only through tail calls, each right after an unconditional end (b, bctr, blr): virtual
# call thunks (lwz r11,0(r3) / lwz r10,N(r11) / mtctr / bctr), setters, and thunks. Their callers forward to a member
# (lwz r3,N(r3), a null check, then b), as GH Van Halen's.
0x825ECBF8 = {}   # branched to from 0x824E91C0 (virtual call thunk, slot 108)
0x825ECC18 = {}   # branched to from 0x824E91A4 (virtual call thunk, slot 124)
0x825ECCA8 = {}   # branched to from 0x824E92B4 (virtual call thunk, slot 172)
0x826039B8 = {}   # branched to from 0x8245FAFC and 0x8245FB18 (sets the byte at +241)
0x82436118 = {}   # branched to from 0x82552AD0 (stores r4 at +144, a flag at +104 of r4 from the byte at +136)
0x8287C6D0 = {}   # branched to from 0x8287CA9C (b 0x8287C338, a one-instruction thunk)
0x828926D0 = {}   # branched to from 0x828926DC (addi r3,r3,8; b: an adjusted-this thunk)
0x828ABE18 = {}   # branched to from 0x8289B204 (sets the word at +572)
