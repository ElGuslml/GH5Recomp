# Stamps the page watches do not see (src/fence_stamps.cpp, gh5_draw_stamps_unwatched, on; GH Warriors of Rock's
# hooks/draw_stamps.toml, its performance plan's Phase 3). A render object's last drawn frame and SetTexture's fence are
# written through the physical view: the render objects share pages with textures, and each of these stores faulted on
# a watched texture page. Both sites are GH Warriors of Rock's instruction for instruction (show.py), the object's
# frame at +128 here (+112 there).
[[midasm_hook]]
address = 0x82314614   # stw r11,8(r28) (sub_823144F8, SetTexture: the sampler's previous texture), then b 0x8231466C
name = "GH5TextureFenceHook"
registers = ["r11", "r28"]
jump_address_on_true = 0x8231466C
[[midasm_hook]]
address = 0x82641830   # stw r11,128(r31) (sub_826416E0: the frame the render object is drawn in)
name = "GH5ObjectFrameHook"
registers = ["r11", "r31"]
jump_address_on_true = 0x82641834
