# gh5_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed, [[switch_tables]] the
# codegen mistranslates and [[midasm_hook]]s into src/. KameoRecomp's kameo_functions.toml, POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml have examples of each. The hooks are GH Van Halen's
# (GHVanHRecomp's ghvanhalen_functions.toml), each found here by a function matcher over both executables' instruction
# indexes and checked instruction by instruction (docs/fixes-from-gh-van-halen.md).

# The C runtime's setjmp and longjmp (sub_82910F90 saves f14-f31, r13-r31, v64-v127, r1, LR and CR in the jmp_buf;
# sub_82910C70 unwinds to it and loads them back), the same code as in GH Van Halen and KameoRecomp. The codegen turns
# calls to them into the host's setjmp and longjmp, keyed by the guest jmp_buf; translated as plain functions, longjmp
# would load the registers and return to its caller instead of jumping. Only the image decoders use them: libjpeg
# (sub_8282DA00: setjmp at its error manager + 144, where its error function sub_8282CAB0 longjmps back) and libpng
# (sub_8282DC20, sub_82840E98: setjmp at the start of the png struct, longjmp from sub_8283F110 and sub_8282CB78).
setjmp_address = 0x82910F90
longjmp_address = 0x82910C70

# Codegen: the registers no call passes on are local variables of each function, not fields of the PPCContext, so
# the compiler keeps them in host registers and the __savegprlr/__restgprlr helpers are elided, as in GH Van Halen,
# KameoRecomp, GRAWRecomp and POTCAWERecomp. non_argument_as_local (r0, r2, r11, r12) stays off: the SEH funclets read
# r12, which the SDK does not pass them. The non-volatile vector registers stay in the context (SDK change 42): this
# game's compiler passes values to its callees in them, outside the calling convention, as GH Van Halen's.
# sub_8271C358, sub_8271DFA8 and sub_827202C0 set v92 (vor128 v92,v12,v12) and call sub_8271BCA8, whose callees
# sub_827A9198, sub_827A93D0 and sub_827A9810 read it without writing it (vmsum4fp128 v63,v92,v0); as local variables
# v92 would be unset there.
non_volatile_as_local = true
non_volatile_vectors_as_local = false
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

[functions]
# The functions that call setjmp keep their registers in the context (share_registers): the host longjmp returns
# into their C++ frame, and the codegen restores the context it saved at the setjmp, not local variables. The guest
# longjmp loaded r14-r31 with their values at the setjmp. None of them calls longjmp itself, so their ends (from
# .pdata) do not move.
0x8282DA00 = { share_registers = true }   # libjpeg's guard
0x8282DC20 = { share_registers = true }   # libpng's guards
0x82840E98 = { share_registers = true }
# Branch (b) targets that the automatic analysis did not assign to any function (the first build, 2026-10-30). All
# are small functions reached only through tail calls, each right after an unconditional end (b, bctr, blr): virtual
# call thunks (lwz r11,0(r3) / lwz r10,N(r11) / mtctr / bctr), setters, and thunks. Their callers forward to a member
# (lwz r3,N(r3), a null check, then b), as GH Van Halen's.
0x825ECBF8 = {}   # branched to from 0x824E91C0 (virtual call thunk, slot 108)
0x825ECC18 = {}   # branched to from 0x824E91A4 (virtual call thunk, slot 124)
0x825ECCA8 = {}   # branched to from 0x824E92B4 (virtual call thunk, slot 172)
0x826039B8 = {}   # branched to from 0x8245FAFC and 0x8245FB18 (sets the byte at +241)
0x82436118 = {}   # branched to from 0x82552AD0 (stores r4 at +144, a flag at +104 of r4 from the byte at +136)
0x8287C6D0 = {}   # branched to from 0x8287CA9C (b 0x8287C338, a one-instruction thunk)
0x828926D0 = {}   # branched to from 0x828926DC (addi r3,r3,8; b: an adjusted-this thunk)
0x828ABE18 = {}   # branched to from 0x8289B204 (sets the word at +572)

# The game's threads wait without spinning (src/thread_waits.cpp): four loops checked a condition again and
# again and kept a core at 100 % each (the three job workers, the main thread at the start of a frame and while
# it waits for the render thread, the render thread waiting for the vertical blank). Each hook spins briefly and then
# sleeps between checks; gh5_wait_sleep_us = 0 disables them. With gh5_wait_smart (on) the workers block on the job
# event, the render thread sleeps until shortly before the vertical blank, and the main thread waiting for a job group
# (sub_82567D20) watches the group's counts between passes instead of taking the queue's lock again at once.
[[midasm_hook]]
address = 0x825E5C3C   # li r4,0 (sub_825E5BE0: a job worker with an empty queue, before WaitForSingleObject(event, 0))
name = "GH5JobWaitHook"
[[midasm_hook]]
address = 0x82413B6C   # cmplwi cr6,r3,0 (sub_82413AA0: while (sub_82664370(0x82E8D180) != 0) {})
name = "GH5FrameWaitHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x82411CFC   # cmplw cr6,r11,r10 (sub_82411CC8: while (frames[24] == frames[20]) {}, waiting for the render thread)
name = "GH5RenderWaitHook"
registers = ["r11", "r10"]
[[midasm_hook]]
address = 0x8255ACFC   # cmpld cr6,r3,r11 (sub_8255ABE8: until the vertical blank counter reaches the next value)
name = "GH5VblankWaitHook"
registers = ["r3", "r11"]
[[midasm_hook]]
address = 0x8255AE44   # cmpld cr6,r3,r30 (sub_8255ABE8: until the other counter reaches the frame's last vertical blank)
name = "GH5VblankWait2Hook"
registers = ["r3", "r30"]
# The game's two callbacks advance the counters those loops wait on: an event set right after each advance wakes the
# waiting render thread at once (src/thread_waits.cpp).
[[midasm_hook]]
address = 0x823B042C   # lwz r10,40(r11) (sub_823B03F0, the swap callback: after the swap counter 0x82D7D540's advance)
name = "GH5SwapSignalHook"
[[midasm_hook]]
address = 0x823B03D8   # and r9,r4,r8 (sub_823B0378, the vertical blank callback: after the counter 0x82D7D530's advance)
name = "GH5VblankSignalHook"
[[midasm_hook]]
address = 0x82567DBC   # lwz r11,0(r31) (sub_82567D20: the main thread waiting for a job group, after a pass)
name = "GH5JobGroupWaitHook"
registers = ["r31", "r30"]
# The D3D library's six waits for the GPU (fences, the present, ...) call sub_82310968 for every check: at 120 FPS
# the render thread spent half its time there (GH Van Halen).
[[midasm_hook]]
address = 0x82310968   # mflr r12 (entry of sub_82310968: a check of a wait for the GPU, its condition still false)
name = "GH5GpuWaitHook"

# Songs in sync with their audio (src/timer.cpp): the engine's timer replaces the 50,000,000 Hz that
# KeQueryPerformanceFrequency reports by the original console's real timebase rate, 49,875,000; the SDK's timebase
# runs at 50 MHz, so the game's clock ran 0.25 % fast and the notes drifted ahead of the audio.
# gh5_timer_fix = false disables it.
[[midasm_hook]]
address = 0x823B098C   # cmplw cr6,r11,r7 (sub_823B08F0: r11 = the reported frequency, r7 = 50,000,000)
name = "GH5TimerFrequencyHook"
registers = ["r7"]


# A slot's kind of controller (a guitar, the drums, the singer) follows the controller played (src/players.cpp): the
# game asks for it only when the port's controller connects, and the keyboard shares slot 0 with the first controller.
[[midasm_hook]]
address = 0x8248A4A8   # mflr r12 (entry of sub_8248A4A8: a controller port's update; r3 = the port)
name = "GH5ControllerPortHook"
registers = ["r3"]

# Ultrawide (src/widescreen.cpp), with gh5_ultrawide: the projection of every 16:9 view is widened (Hor+: the 3D views
# see more at the sides; their aspect ratio is the view's size, not the SetScreen aspect), and the screen elements'
# vertices (pixels of the 1280x720 canvas) are narrowed around the center just before they are drawn to the screen
# (the menus, the HUD, the note highway and its notes stay 16:9), with the clip windows they draw through.
[[midasm_hook]]
address = 0x823D9828   # entry of sub_823D9828, a perspective projection from its frustum (f1-f4: left, right, bottom, top)
name = "GH5FrustumHook"
registers = ["f1", "f2", "f3", "f4"]
[[midasm_hook]]
address = 0x8255FDA0   # bl DrawVerticesUP in sub_8255FB90 (a sprite's quad: r6 = its vertices, r7 = their stride)
name = "GH5SpriteHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x82625F50   # bl DrawVerticesUP in sub_82625A60 (another element's quad: the loading screen's layers)
name = "GH5ElementQuadHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x825D5EE0   # bl DrawVerticesUP in sub_825D5DF8 (a batch of quads: r5 = vertices, r6 = data, r7 = stride)
name = "GH5SpriteBatchHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x8255EC3C   # bl SetScissorRect in sub_8255EAD8 (a screen element's clip window: r4 = {x1, y1, x2, y2})
name = "GH5ClipWindowHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x82301498   # bl DrawVerticesUP in sub_82300AE0 (a sustained note's tail: r5 = vertices, r6 = data, r7 = stride)
name = "GH5TailHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x822FE92C   # bl EndVertices in sub_822FE350 (a sprite drawn as a grid of quads, the highway's board: r3 = device)
name = "GH5MeshSpriteHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x822FFF38   # bl EndVertices in sub_822FFA78 (the highway's depth mask, a quad of 8 byte vertices: r3 = device)
name = "GH5HighwayMaskHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x82303338   # bl DrawVerticesUP in sub_823031E8 (a 2D particle's quad: r5 = vertices, r6 = data, r7 = stride)
name = "GH5ParticleHook"
registers = ["r5", "r6", "r7"]


# Frame rates above 60 (src/framerate.cpp, gh5_frame_rate_fix): the engine's clocks counted in vertical blanks
# divide by its vertical blanks per second (the global 0x82B26F0C, 60): the divisions use it times the emulated
# vblank's rate over 60, so those clocks keep their speed (no visible case known). GH Van Halen's frame time hook is
# not needed: GH5's frame time is measured on the time base.
[[midasm_hook]]
address = 0x82637A80   # extsw r8,r30 (sub_82637918: a vblank clock's vblanks into seconds, r30 = vblanks per second)
name = "GH5VblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x82637D08   # extsw r11,r30 (sub_82637918: seconds back into vblanks, r30 = vblanks per second)
name = "GH5VblankClockHook"
registers = ["r30"]
# Script waits counted in game frames ("Wait N gameframes", and GH5's Yield): above 60 Hz they last the console's N / 60 s.
[[midasm_hook]]
address = 0x8257E498   # entry of sub_8257E498 (a type 1 game-frame wait set: r3 = the wait, r4 = N)
name = "GH5FrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8257E448   # entry of sub_8257E448 (a type 8 game-frame wait set: r3 = the wait, r4 = N)
name = "GH5FrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8257E7DC   # addi r11,r11,-1 (sub_8257E798: a game-frame wait's count above 0, r3 = the wait)
name = "GH5FrameWaitCountHook"
registers = ["r3", "r11"]
# The drummer's script waits 1 frame, a timed wait: above 60 Hz a real frame, so that the step it measures is what a pass took.
[[midasm_hook]]
address = 0x824AB938   # Wait (sub_824AB790), units frame and frames: lis r11,-32256 (r30 = the script)
name = "GH5DrummerWaitHook"
registers = ["r30"]
jump_address_on_true = 0x824AB978   # its game-frame wait, the same N
# Button presses polled by scripts (ControllerMake) last one frame: a script whose waits are held above 60 Hz is given
# the presses of the frames it skipped.
[[midasm_hook]]
address = 0x824B5A8C   # bgt cr6 (sub_824B58C8: a controller's input state updated, r30 = the state, r9 = the pressed bits)
name = "GH5InputUpdateHook"
registers = ["r30", "r9"]
[[midasm_hook]]
address = 0x824C06B0   # entry of sub_824C06B0 (the script function ControllerMake: r4 = the script)
name = "GH5ButtonPollHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x824C0770   # addi r1,r1,112 (sub_824C06B0's exit, every path)
name = "GH5ButtonPollEndHook"
# The frames' real length (src/framerate.cpp: what is counted in frames above 60 Hz keeps the console's time by it when
# the frame rate falls below the chosen one), measured once a frame on the main thread.
[[midasm_hook]]
address = 0x82413BCC   # addi r1,r1,128 (sub_82413AA0: the main thread's frame, at its end)
name = "GH5MainFrameHook"
# The whammy on a sustain is told by the frame (the bar's movement since the previous frame, a countdown of 5 frames,
# 5 frames in a row to turn a star power sustain blue or back): above 60 Hz over a 60th of a second and 5 / 60 s, in
# frames of their measured length.
[[midasm_hook]]
address = 0x821D4EF0   # mflr r12 (sub_821D4EF0: a player's update in a song, every frame; src/keyboard.cpp)
name = "GH5SongFrameHook"
[[midasm_hook]]
address = 0x821E6F2C   # fsubs f0,f30,f0 (sub_821E6DB0, a guitar: the bar's position minus the previous frame's)
name = "GH5WhammyHook"
registers = ["r30", "f30", "f0"]
[[midasm_hook]]
address = 0x821E7024   # fsubs f12,f30,f0 (sub_821E6DB0, another controller: the first axis minus the previous frame's)
name = "GH5WhammyHook"
registers = ["r30", "f30", "f0"]
[[midasm_hook]]
address = 0x821E7038   # fsubs f0,f29,f0 (sub_821E6DB0, another controller: the second axis minus the previous frame's)
name = "GH5Whammy2Hook"
registers = ["r30", "f29", "f0"]
[[midasm_hook]]
address = 0x821E1BC4   # fsubs f13,f0,f13 (sub_821E1A38, the touch strip: its position minus the previous frame's)
name = "GH5WhammyHook"
registers = ["r31", "f0", "f13"]
[[midasm_hook]]
address = 0x821E6F58   # stwx r10,r30,r8 (sub_821E6DB0: the whammy countdown, 5 frames)
name = "GH5WhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x821E7058   # lfs f13,14884(r8) (sub_821E6DB0: r10 = 5, the countdown both axes store)
name = "GH5WhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x821E1BF0   # stwx r9,r31,r8 (sub_821E1A38: the whammy countdown, 5 frames)
name = "GH5WhammyCountdownHook"
registers = ["r9"]
[[midasm_hook]]
address = 0x821E9878   # cmpwi cr6,r11,5 (sub_821E96C8: frames in a row of whammying, r30 = the count's address)
name = "GH5WhammyStateHook"
registers = ["r30", "r11"]
[[midasm_hook]]
address = 0x821E9958   # cmpwi cr6,r11,5 (sub_821E96C8: frames in a row of not whammying, r10 = the count's address)
name = "GH5WhammyStateHook"
registers = ["r10", "r11"]
# The loading screen's animations step by the frame: above 60 Hz each step is scaled by the frame's length in 60ths of a
# second, each animation measuring its own frames (the render thread draws it while the main thread loads).
[[midasm_hook]]
address = 0x825E1434   # after lfd f31,-24376(r10) (sub_825E1320: the boot's spinning star, f31 = its turn each frame, 0.175 radians)
name = "GH5LoadingStarHook"
registers = ["f31"]
[[midasm_hook]]
address = 0x82427394   # add r11,r10,r11 (sub_82427348: DisplayLoadingScreen's icon, its angle plus its step, r10 = the step in degrees)
name = "GH5LoadingSpinnerHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x825E18C0   # fadds f0,f0,f29 (sub_825E1698's mode 2: a wave's phase plus its step, f29)
name = "GH5LoadingWaveHook"
registers = ["f29"]
[[midasm_hook]]
address = 0x825E18D0   # fadds f0,f13,f0 (sub_825E1698's mode 2: the other phase plus its step, f0)
name = "GH5LoadingWave2Hook"
registers = ["f0"]

# The screen effects each turned off by an option (src/screen_fx.cpp, gh5_fx_*): the effects' composite
# (sub_82643598, two passes) picks its shader variants, sets each effect's constants and chooses how each pass draws
# from a word of flags, one bit per effect, read three times: each read loses the bits of the effects turned off.
[[midasm_hook]]
address = 0x8264392C   # mr r31,r20 (sub_82643598), after lwz r11,4(r18): r11 = the flags, for both passes' variants
name = "GH5ScreenFxFlagsHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x82643A7C   # clrlwi r3,r4,26 (sub_82643598), after lwz r4,4(r18): r4 = the flags, Pass0's way of drawing
name = "GH5ScreenFxFlagsHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x82643B40   # clrlwi r9,r11,23 (sub_82643598), after lwz r11,4(r18): r11 = the flags, Pass1's way of drawing
name = "GH5ScreenFxFlagsHook"
registers = ["r11"]

# Quitting from the main menu (src/quit_prompt.cpp): once per frame, the hook looks the main menu's own element up in
# the game's element table and offers the SDK's quit prompt (B) while it exists and no dialog box does.
[[midasm_hook]]
address = 0x82413B60   # stfd f0,-30400(r7) (sub_82413AA0: the main thread's frame, before its wait)
name = "GH5QuitPromptHook"

# Above 60 Hz (src/framerate.cpp): the strings' 62 Hz vibration, which 60 FPS shows as a 2 Hz wobble, and their fade of
# 0.99 a frame, as at 60 (GH Metallica's).
[[midasm_hook]]
address = 0x821BA658   # lis r11,-32256 (sub_821BA5D8, after the call returning the strings' frequency, 62 Hz)
name = "GH5StringFrequencyHook"
registers = ["f1"]
[[midasm_hook]]
address = 0x821B3904   # lwz r11,284(r31) (sub_821B38C8, after the call returning the strings' fade, 0.99 a frame)
name = "GH5StringFadeHook"
registers = ["f1"]

# NativeXRenderer's shadow quality (src/native_x_renderer_gh5.cpp): the shadows' filter follows the map's size.
[[midasm_hook]]
address = 0x825CD048   # fmr f31,f0 (sub_825CCE98, after the shadow map's texel size is loaded)
name = "GH5ShadowFilterHook"
registers = ["f0", "f12"]
